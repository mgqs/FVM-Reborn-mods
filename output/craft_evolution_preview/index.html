<script>
/* ───────────────── 常量（与 obj_craft_bg / obj_craft_select_btn 对齐）───────────────── */

/* ───────────────── 数据：xlsx 15 条路线 = 3 条神器链 + 12 条宝石系（27 步）───────────────── */

const GEM_CHAINS = [

      { id: 'star_wand_gem_5',         name: '星之耀',   icon: 'star_wand_gem_5.png' } ] },
  { key: '星之力系', items: [

  { key: '星之力系', items: [

      { id: 'zeus_anger_gem',          name: '天神之怒', icon: 'zeus_anger_gem_icon.png' },

  { key: '星之力系', items: [

      { id: 'rose_shield_gem_1',      name: '光合作用', icon: 'rose_shield_gem_1.png' } ] },
  { key: '撕裂系', items: [
      { id: 'gods_shield_gem_2',   name: '撕裂之源', icon: 'gods_shield_gem_2.png' },
      { id: 'divine_shenji_gem',   name: '神忌之眼', icon: 'divine_shenji_gem_icon.png' },
      { id: 'rose_shield_gem_2',   name: '荆棘之刺', icon: 'rose_shield_gem_2.png' } ] },
  { key: '增幅系', items: [

      { id: 'divine_protect_gem',  name: '神护之眼', icon: 'divine_protect_gem_icon.png' },

      { id: 'rose_shield_gem_5',   name: '玫瑰之心', icon: 'rose_shield_gem_5.png' } ] },
  { key: '生命系', items: [

  { key: '亡灵系', items: [
      { id: 'death_scythe_gem_1', name: '死神一击', icon: 'death_scythe_gem_1.png' },

      { id: 'aladdin_lamp_gem_4', name: '灯神迷雾', icon: 'aladdin_lamp_gem_4.png' } ] },
];

/* 宝石进化返还阶梯（cost_gem_level 0~15 → [强化水晶, 高级强化水晶]） */
const GEM_REFUND = [[0,0],[0,0],[15,0],[30,0],[55,0],[90,0],[185,0],[275,0],[375,0],[505,0],[1000,0],[1000,400],[1000,800],[1000,1850],[1000,3900],[1000,6800]];

/* 凭证默认名字 = 目标物名 + 进化凭证（唯一例外：神弩进化凭证） */
function creditName(chain, i, target) {
  if (chain.credits && chain.credits[i]) return chain.credits[i];
  if (target.name === '宙斯神弩') return '神弩进化凭证';
  return target.name + '进化凭证';
}

/* ───────────────── 玩家状态（预览用假存档）───────────────── */
const state = {
  page: 'weapon',                  // weapon / gem
  own: {},                         // id -> {lv, n}
  credits: {},                     // 凭证名 -> 数量
  sel: null,                       // {chainKey, step}
  slotA: null,                     // {id,name,icon,lv}
  gold: 11763091,
};

function give(id, lv = 1, n = 1) { state.own[id] = { lv, n }; }
function giveCredit(name, n) { state.credits[name] = (state.credits[name] || 0) + n; }

function initState() {
  give('poseidon_dart_gun', 8); give('zeus_bolt', 6); give('gods_shield', 10);
  give('death_scythe', 5); give('hades_scythe', 3);
  give('poseidon_dart_gun_gem_1', 4); give('poseidon_dart_gun_gem_3', 7);
  give('zeus_shadow_gem', 6); give('zeus_power_gem', 3); give('zeus_anger_gem', 5);
  give('star_wand_gem_1', 2);
  give('gods_shield_gem_1', 9); give('gods_shield_gem_3', 5);
  give('divine_protect_gem', 4);
  give('death_scythe_gem_1', 6); give('death_scythe_gem_2', 4);
  give('ghost_strike_gem', 5);
  give('aladdin_lamp_gem_1', 3);
  giveCredit('神弩进化凭证', 2); giveCredit('神杖进化凭证', 1);
  giveCredit('天神之影进化凭证', 3); giveCredit('天神之怒进化凭证', 1);
  giveCredit('星之焕进化凭证', 1); giveCredit('神盾进化凭证', 1);
  giveCredit('神护之眼进化凭证', 2); giveCredit('玫瑰之护进化凭证', 0);
  giveCredit('亡灵强袭进化凭证', 2); giveCredit('灯神原力进化凭证', 1);
  giveCredit('战镰进化凭证', 1); giveCredit('星之耀进化凭证', 0);
}
initState();

/* ───────────────── 步骤模型 ───────────────── */
function chains() { return state.page === 'weapon' ? WEAPON_CHAINS : GEM_CHAINS; }
function stepsOfPage() {
  const out = [];
  chains().forEach((ch, ci) => {
    for (let i = 0; i < ch.items.length - 1; i++) {
      const from = ch.items[i], to = ch.items[i + 1];
      out.push({ ci, si: i, chain: ch, from, to, credit: creditName(ch, i, to) });
    }
  });
  return out;
}
function findStepStep(fromId) {
  return stepsOfPage().find(s => s.from.id === fromId) || null;
}
function allItemsOfPage() {
  const seen = new Map();
  chains().forEach(ch => ch.items.forEach(it => { if (!seen.has(it.id)) seen.set(it.id, it); }));
  return [...seen.values()];
}

/* ───────────────── 绘制 ───────────────── */
const stage = document.getElementById('stage');
const credName = document.getElementById('credName');

// 底部凭证架：滚轮横滚 + 两端翻页（凭证数量随页签变，宝石页 27 张要能翻）
(function () {
  const wrap = document.getElementById('propsWrap');
  wrap.addEventListener('wheel', e => {
    if (wrap.scrollWidth <= wrap.clientWidth) return;
    wrap.scrollLeft += (e.deltaY || e.deltaX);
    e.preventDefault();
    updatePropArrows();
  }, { passive: false });
  wrap.addEventListener('scroll', updatePropArrows);
  document.getElementById('pl').onclick = () => { wrap.scrollLeft -= PROP.pitch * 5; updatePropArrows(); };
  document.getElementById('pr').onclick = () => { wrap.scrollLeft += PROP.pitch * 5; updatePropArrows(); };
})();

function placeBG() {
  const l = CX - BG_W * BG_S / 2, t = CY - BG_H * BG_S / 2;
  ['b0', 'b1', 'b2', 'b3'].forEach(id => {
    const el = document.getElementById(id);
    el.style.left = l + 'px'; el.style.top = t + 'px';
    el.style.width = (BG_W * BG_S) + 'px'; el.style.height = (BG_H * BG_S) + 'px';
  });
}
function placeTabs() {
  const ids = [['tab0', 0], ['tab1', 1], ['tab2', 2]];
  ids.forEach(([id, i]) => {
    const el = document.getElementById(id);
    el.style.left = (TAB.left + i * TAB.gap) + 'px';
    el.style.top = TAB.top + 'px';
    el.style.width = (TAB.w * TAB.s) + 'px';
    el.style.height = (TAB.h * TAB.s) + 'px';
  });
  document.getElementById('tab1').classList.remove('dim');
  document.getElementById('tab0').classList.add('dim');
  document.getElementById('tab2').classList.add('dim');
}

const NAVS = [
  { id: 'card', lines: ['金卡', '进化'], page: 'card' },
  { id: 'weapon', lines: ['神器', '进化'], page: 'weapon' },
  { id: 'gem', lines: ['宝石', '进化'], page: 'gem' },
];
function buildNav() {
  const host = document.getElementById('navs'); host.innerHTML = '';
  NAVS.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'navbtn ' + (state.page === n.id ? 'on' : 'off');
    el.style.left = (NAV.x - 82.8 / 2) + 'px';
    el.style.top = (NAV.y0 + i * NAV.pitch - 151.2 / 2) + 'px';
    el.innerHTML = '<div class="navbg" style="background-image:url(assets/'
      + (state.page === n.id ? 'btnsel_1.png' : 'btnsel_0.png') + ')"></div>'
      + '<div class="navtxt cn"><span>' + n.lines[0] + '</span><span>' + n.lines[1] + '</span></div>';
    el.onclick = () => {
      if (n.id === 'card') { toast('金卡进化页已在游戏内实现，本预览只看神器 / 宝石'); return; }
      state.page = n.id; state.sel = null; state.slotA = null; render();
    };
    host.appendChild(el);
  });
}

function slotHTML(x, y, item, size) {
  const s = size || 1;
  let inner = '';
  if (item) {
    const maxPx = 96 * s;
    inner = '<img class="sloticon" src="assets/' + item.icon + '" style="max-width:' + maxPx + 'px;max-height:' + maxPx + 'px;">';
    if (item.lv) inner += '<div class="lv cn">' + item.lv + '</div>';
  }
  return '<div class="slotbg" style="background-image:url(assets/slot_card.png)"></div>' + inner;
}

function creditIcon(iconName, px) {
  return '<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:' + px + 'px;height:' + px + 'px;">'
    + '<img src="assets/credit_bg.png" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:' + px + 'px;height:' + px + 'px;">'
    + '<img src="assets/' + iconName + '" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:' + (px * 0.62) + 'px;max-height:' + (px * 0.62) + 'px;">'
    + '</div>';
}


function selectItem(id) {
  const it = allItemsOfPage().find(x => x.id === id);
  if (!it) return;
  if (!state.own[id]) { toast('未拥有：' + it.name); return; }
  const stp = findStepStep(id);
  if (!stp) { toast(it.name + ' 已是该系最终形态'); return; }
  state.slotA = { id: it.id, name: it.name, icon: it.icon, lv: state.own[it.id].lv };
  state.sel = { ci: stp.ci, si: stp.si };
  render();
}

// 反方向：点下方凭证 → 反查它属于哪一步 → 回填旧物槽（旧物没拥有就只填凭证，提示缺什么）
function selectCredit(name) {
  const stp = stepsOfPage().find(s => s.credit === name);
  if (!stp) { toast('这张凭证不在当前页'); return; }
  state.sel = { ci: stp.ci, si: stp.si };
  const own = state.own[stp.from.id];
  state.slotA = own ? { id: stp.from.id, name: stp.from.name, icon: stp.from.icon, lv: own.lv } : null;
  render();
  if (!own) toast('凭证已放入，但缺少「' + stp.from.name + '」');
  else if ((state.credits[name] || 0) <= 0) toast('凭证已放入，但这张凭证数量为 0');
}

function render() {
  buildNav();
  renderPanel();
  renderGrid();
  renderProps();
  document.getElementById('gold').textContent = state.gold.toLocaleString('en-US');
  document.getElementById('gold').style.left = (CX + 758 - 200) + 'px';
  document.getElementById('gold').style.top = (CY + 473 - 14) + 'px';
  document.getElementById('gold').style.width = '200px';
  document.getElementById('gold').style.textAlign = 'right';
  document.getElementById('gold').style.fontFamily = 'GameCN';
}

function renderPanel() {
  const isW = state.page === 'weapon';
  const st = state.sel ? stepsOfPage().find(s => s.ci === state.sel.ci && s.si === state.sel.si) : null;
  document.getElementById('title0').textContent = isW ? '神器进化' : '宝石进化';

  const slots = document.getElementById('slots'); slots.innerHTML = '';
  const res = document.getElementById('res'); res.innerHTML = '';
  const arrow = document.getElementById('arrow'); arrow.innerHTML = '';

  // 左槽：原物
  const s1 = document.createElement('div');
  s1.className = 'slot' + (state.slotA ? '' : ' empty');
  s1.style.left = (SLOT.x1 - 104.4 / 2) + 'px';
  s1.style.top = (SLOT.y - 122.4 / 2) + 'px';
  s1.innerHTML = state.slotA
    ? slotHTML(0, 0, state.slotA, 1)
    : '<div class="slotbg" style="background-image:url(assets/slot_card.png);opacity:.85"></div>'
      + '<div class="tag cn" style="top:50%;bottom:auto;transform:translate(-50%,-50%)">' + (isW ? '放武器' : '放宝石') + '</div>';
  s1.onclick = () => { state.slotA = null; state.sel = null; render(); };
  s1.onmouseenter = () => s1.classList.add('hover');
  s1.onmouseleave = () => s1.classList.remove('hover');
  slots.appendChild(s1);

  // 右槽：凭证（可点：点一下取回整组，与金卡进化「点槽下卡」一致）
  const s2 = document.createElement('div');
  const cName = st ? st.credit : '';
  const cNum = cName ? (state.credits[cName] || 0) : 0;
  s2.className = 'slot' + (cName ? '' : ' empty');
  s2.style.left = (SLOT.x2 - 104.4 / 2) + 'px';
  s2.style.top = (SLOT.y - 122.4 / 2) + 'px';
  if (cName) {
    s2.innerHTML = '<div class="slotbg" style="background-image:url(assets/slot_prop.png);height:104.4px;top:9px"></div>'
      + creditIcon(st.to.icon, 84)
      + '<div class="cnt cn" style="color:' + (cNum > 0 ? '#c8ffb0' : '#ff9c9c') + '">x' + cNum + '</div>';
    s2.title = '点击取回凭证';
    s2.onclick = () => { state.slotA = null; state.sel = null; render(); };
  } else {
    s2.innerHTML = '<div class="slotbg" style="background-image:url(assets/slot_prop.png);height:104.4px;top:9px;opacity:.85"></div>'
      + '<div class="tag cn" style="top:50%;bottom:auto;transform:translate(-50%,-50%)">放凭证</div>';
    s2.title = '在下方道具栏点一张凭证';
  }
  s2.onmouseenter = () => s2.classList.add('hover');
  s2.onmouseleave = () => s2.classList.remove('hover');
  slots.appendChild(s2);

  // 箭头
  arrow.innerHTML = '<img src="assets/arrow.png" style="width:' + (34 * 1.8) + 'px;height:' + (34 * 1.8) + 'px;">';
  arrow.style.left = (ARROW.x - 34 * 1.8 / 2) + 'px';
  arrow.style.top = (ARROW.y - 34 * 1.8 / 2) + 'px';

  // 结果槽
  const r = document.createElement('div');
  r.className = 'slot';
  r.style.left = (RES.x - 104.4 / 2) + 'px';
  r.style.top = (RES.y - 122.4 / 2) + 'px';
  if (st) {
    r.innerHTML = '<div class="slotbg" style="background-image:url(assets/slot_result.png)"></div>'
      + '<img class="sloticon" src="assets/' + st.to.icon + '" style="max-width:96px;max-height:96px;">';
  } else {
    r.innerHTML = '<div class="slotbg" style="background-image:url(assets/slot_result.png)"></div>'
      + '<img src="assets/question.png" style="position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:' + (19 * 2.2) + 'px;">';
  }
  res.appendChild(r);
  res.style.left = '0'; res.style.top = '0';

  // 进化按钮
  const ok = !!(st && state.slotA && cNum > 0);
  const btn = document.getElementById('btn');
  btn.style.left = (BTN.x - 145.8 / 2) + 'px';
  btn.style.top = (BTN.y - 75.6 / 2) + 'px';
  btn.style.backgroundImage = 'url(assets/btn_' + (ok ? 0 : 2) + '.png)';
  btn.className = ok ? '' : 'dis';
  btn.onmouseenter = () => { if (ok) btn.style.backgroundImage = 'url(assets/btn_1.png)'; };
  btn.onmouseleave = () => { btn.style.backgroundImage = 'url(assets/btn_' + (ok ? 0 : 2) + '.png)'; };
  btn.onclick = () => { if (ok) doEvolve(st, cName); };

  // 提示行
  const hint = document.getElementById('hint');
  if (st) {
    const lv = state.slotA ? (state.slotA.lv || 1) : 1;
    let line2 = '';
    if (!state.slotA) line2 += '<span style="color:#b33">缺少「' + st.from.name + '」（未拥有）</span>';
    if (cNum <= 0) line2 += (line2 ? ' ｜ ' : '') + '<span style="color:#b33">凭证不足</span>';
    if (!line2) {
      if (isW) {
        line2 = '<span style="color:#7a5a2e">武器等级保留</span>';
      } else {
        const rf = GEM_REFUND[Math.min(lv, 15)];
        line2 = '进化后 <strong>Lv.0</strong>，返还 强化水晶 x' + rf[0]
          + (rf[1] ? ' + 高级强化水晶 x' + rf[1] : '');
      }
    }
    hint.innerHTML = st.from.name + ' + <span style="color:#a1431a">' + st.credit + '</span> x1 &nbsp;→&nbsp; '
      + '<span style="color:#a1431a">' + st.to.name + '</span><br>' + line2;
  } else if (state.page === 'weapon') {
    hint.innerHTML = '点右侧<strong>武器</strong>，或点下方<strong>凭证</strong> → 自动配好另一件';
  } else {
    hint.innerHTML = '点右侧<strong>宝石</strong>，或点下方<strong>凭证</strong> → 自动配好另一件';
  }
}

function renderGrid() {
  const host = document.getElementById('grid'); host.innerHTML = '';
  const items = allItemsOfPage();
  items.forEach((it, i) => {
    const c = i % GRID.cols, r = Math.floor(i / GRID.cols);
    if (r >= GRID.rows) return;
    const owned = !!state.own[it.id];
    const stp = findStepStep(it.id);
    const canEvo = owned && stp && (state.credits[stp.credit] || 0) > 0;
    const el = document.createElement('div');
    el.className = 'cell' + (owned ? '' : ' notown')
      + (state.slotA && state.slotA.id === it.id ? ' sel' : '');
    el.style.left = (GRID.x - 76 / 2 + c * GRID.cw) + 'px';
    el.style.top = (GRID.y - 88 / 2 + r * GRID.ch) + 'px';
    el.innerHTML = '<img src="assets/' + it.icon + '">'
      + '<div class="nm cn">' + it.name + '</div>'
      + (owned ? '<div class="lvb cn">' + state.own[it.id].lv + '</div>' : '')
      + (canEvo ? '<div class="badge cn">可进化</div>' : '');
    el.onclick = () => selectItem(it.id);
    host.appendChild(el);
  });
}

function creditIconOf(name) {
  const st = stepsOfPage().concat(
    (state.page === 'weapon' ? [] : WEAPON_CHAINS.flatMap(ch => {
      const o = []; for (let i = 0; i < ch.items.length - 1; i++) o.push({ to: ch.items[i + 1], credit: creditName(ch, i, ch.items[i + 1]) }); return o;
    }))
  ).find(s => s.credit === name);
  if (st) return st.to.icon;
  for (const ch of GEM_CHAINS) {
    for (let i = 0; i < ch.items.length - 1; i++) {
      if (creditName(ch, i, ch.items[i + 1]) === name) return ch.items[i + 1].icon;
    }
  }
  for (const ch of WEAPON_CHAINS) {
    for (let i = 0; i < ch.items.length - 1; i++) {
      if (creditName(ch, i, ch.items[i + 1]) === name) return ch.items[i + 1].icon;
    }
  }
  return null;
}

const PROP = { pitch: 66, pad: 6 };

// 当前页的凭证，按链顺序去重（点选顺序 = 右侧列表顺序，手感一致）
function pageCreditNames() {
  const out = [];
  stepsOfPage().forEach(s => { if (out.indexOf(s.credit) < 0) out.push(s.credit); });
  return out;
}

function renderProps() {
  const host = document.getElementById('props');
  const wrap = document.getElementById('propsWrap');
  host.innerHTML = '';
  const names = pageCreditNames();
  host.style.width = (names.length * PROP.pitch + PROP.pad * 2) + 'px';

  const st = state.sel ? stepsOfPage().find(s => s.ci === state.sel.ci && s.si === state.sel.si) : null;
  const curCredit = st ? st.credit : '';

  names.forEach((n, i) => {
    const cnt = state.credits[n] || 0;
    const el = document.createElement('div');
    el.className = 'prop' + (cnt > 0 ? '' : ' zero') + (n === curCredit ? ' sel' : '');
    el.style.left = (i * PROP.pitch + PROP.pad) + 'px';
    el.innerHTML = creditIcon(creditIconOf(n), 56)
      + '<div class="pb cn" style="color:' + (cnt > 0 ? '#e9ffd8' : '#ff9d9d') + '">' + cnt + '</div>';
    el.onclick = () => selectCredit(n);
    el.onmouseenter = () => { credName.textContent = '凭证：' + n + (cnt > 0 ? '  ×' + cnt : '（未获得）'); };
    el.onmouseleave = () => { credName.textContent = ''; };
    host.appendChild(el);
  });

  if (wrap.dataset.page !== state.page) { wrap.dataset.page = state.page; wrap.scrollLeft = 0; }
  credName.textContent = '';

  // 选中项自动滚进可视区（宝石页 27 张，避免「选了却看不到」）
  const selEl = host.querySelector('.prop.sel');
  if (selEl) {
    const l = selEl.offsetLeft;
    if (l < wrap.scrollLeft) wrap.scrollLeft = Math.max(0, l - 8);
    else if (l + 60 > wrap.scrollLeft + wrap.clientWidth) wrap.scrollLeft = l + 60 - wrap.clientWidth + 8;
  }
  updatePropArrows();
}

function updatePropArrows() {
  const wrap = document.getElementById('propsWrap');
  const over = wrap.scrollWidth > wrap.clientWidth + 4;
  document.getElementById('pl').style.display = (over && wrap.scrollLeft > 2) ? 'flex' : 'none';
  document.getElementById('pr').style.display =
    (over && wrap.scrollLeft < wrap.scrollWidth - wrap.clientWidth - 2) ? 'flex' : 'none';
}

/* ───────────────── 进化 ───────────────── */
function doEvolve(st, cName) {
  const btn = document.getElementById('btn');
  btn.classList.add('press'); setTimeout(() => btn.classList.remove('press'), 120);
  state.credits[cName] -= 1;
  delete state.own[st.from.id];
  const toLv = state.own[st.to.id] ? state.own[st.to.id].lv : 1;
  state.own[st.to.id] = { lv: Math.max(toLv, 1), n: 1 };
  const fx = document.getElementById('fx');
  fx.classList.remove('on'); void fx.offsetWidth; fx.classList.add('on');
  toast('进化成功：' + st.from.name + ' → ' + st.to.name);
  state.slotA = null; state.sel = null;
  setTimeout(render, 260);
}

let toastT = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 1600);
}

/* ───────────────── 缩放 ───────────────── */
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', () => { fit(); updatePropArrows(); });

/* ───────────────── 启动 ───────────────── */
const _q = new URLSearchParams(location.search);
if (_q.get('auto') === 'gem') state.page = 'gem';
placeBG(); placeTabs(); render();
if (_q.get('auto')) {
  if (_q.get('auto') === 'gem') selectItem('poseidon_dart_gun_gem_1');
  else if (_q.get('auto') === 'weapon2') selectItem('zeus_bolt');
  else if (_q.get('auto') === 'gem2') { state.page = 'gem'; render(); selectItem('zeus_shadow_gem'); }
  else selectItem('poseidon_dart_gun');
}
// 便于验证：?pick=<凭证名> 直接模拟「点下方凭证」
if (_q.get('pick')) selectCredit(_q.get('pick'));
fit();
document.getElementById('tab0').onclick = () => toast('卡片宝石（强化）页：本次不改');
document.getElementById('tab2').onclick = () => toast('食灵融合页：本次不改');
document.getElementById('tab1').onclick = () => toast('当前就在「神级进化」页签下');
</script>
</body>
