","tier":0,"form":"A","stack":1,"cd":"美食获得 25 点固定减伤","ed":"鼠军获得 50 点固定减伤","impl":true},{"id":"hex_222","name":"齿轮的烟气","tier":0,"form":"A","stack":1,"cd":"美食每受一次伤，之后受到的伤害 +2%（上限 +30%）","ed":"鼠军每受一次伤，之后受到的伤害 +2.5%（上限 +50%）","impl":true},{"id":"hex_225","name":"演出的高潮","tier":0,"form":"A","stack":1,"cd":"本局全队随机获得 1%~100% 全属性","ed":"每只鼠军出生时随机获得 -10~+10 点伤害减免","impl":true},{"id":"hex_228","name":"血魔的渴血","tier":0,"form":"A","stack":1,"cd":"美食造成伤害时回复等量生命，满血则转为生命上限（上限 +300%）","ed":"非 BOSS 鼠军啃咬美食时回复等量生命","impl":true},{"id":"hex_235","name":"微微发亮的宝石","tier":0,"form":"A","stack":1,"cd":"武器宝石技能冷却 -10%","ed":"无","impl":true},{"id":"hex_238","name":"呼朋唤友","tier":0,"form":"A","stack":1,"cd":"对 BOSS 伤害 +50%","ed":"BOSS 首次出现时再出现一只同类（半血）","impl":true},{"id":"hex_240","name":"爆破区","tier":0,"form":"A","stack":1,"cd":"每 30 秒在随机格生成一颗既有炸弹（可乐炸弹 / 冰桶炸弹）","ed":"无","impl":true},{"id":"hex_243","name":"疑神疑鬼","tier":0,"form":"A","stack":1,"cd":"攻击类美食在场上没有鼠军目标时也不会停止攻击（照常空放）","ed":"每 30 秒在第 9 列随机行生成一只幽灵鼠","impl":true},{"id":"hex_244","name":"地广人稀","tier":0,"form":"C","stack":1,"cd":"所有卡槽冷却时间翻倍","ed":"出怪量减半","impl":true},{"id":"hex_245","name":"死神临近","tier":0,"form":"C","stack":1,"cd":"每 10 秒随机带走一张美食","ed":"每 10 秒随机带走一只鼠军（含 BOSS）","impl":true},{"id":"hex_249","name":"这不是外挂","tier":0,"form":"A","stack":1,"cd":"穿透类卡片攻击 +30%，火苗获取 -50%","ed":"无","impl":true},{"id":"hex_255","name":"冰冰冰","tier":0,"form":"A","stack":1,"cd":"每 20 秒全场美食与鼠军冻结 5 秒","ed":"无","impl":true}];
const TIER_NAME = ['银','金','彩'];
const MAX = 16;

let state = { tier: -1, form: -1, q: '' };
let selected = ['hex_173','hex_234','hex_231','hex_240','hex_120','hex_159'];
let scrollTop = 0;

const gridEl  = document.getElementById('grid');
const thumbEl = document.getElementById('thumb');
const selList = document.getElementById('sel-list');
const cntSel  = document.getElementById('cnt-sel');

document.getElementById('n-total').textContent = HEX.length;
document.getElementById('n-impl').textContent  = HEX.filter(h => h.impl).length;

function filtered() {
  const q = state.q.trim().toLowerCase();
  return HEX.filter(h => {
    if (state.tier >= 0 && h.tier !== state.tier) return false;
    if (state.form !== -1 && h.form !== state.form) return false;
    if (q && !(h.name.toLowerCase().includes(q) || (h.cd || '').toLowerCase().includes(q))) return false;
    return true;
  });
}

function render() {
  const list = filtered();
  const rows = Math.ceil(list.length / 3);
  const totalH = rows * 114;
  const maxScroll = Math.max(0, totalH - 670);
  scrollTop = Math.min(scrollTop, maxScroll);
  gridEl.style.transform = 'translateY(' + (-scrollTop) + 'px)';

  gridEl.innerHTML = list.map(h => {
    const on = selected.includes(h.id);
    const cls = ['card', 't' + h.tier];
    if (on) cls.push('sel');
    if (!h.impl) cls.push('off');
    const stack  = h.stack > 1 ? '<div class="cstack">叠 1/' + h.stack + '</div>' : '';
    const offTag = h.impl ? '' : '<div class="off-tag">未实装</div>';
    const chk    = on ? '<div class="chk">✓</div>' : '';
    return '<div class="' + cls.join(' ') + '" data-id="' + h.id + '">' +
      '<div class="bar" style="background:' + (h.form === 'C' ? '#FF6E6E' : '#7CE38B') + '"></div>' +
      chk +
      '<div class="ctier">' + TIER_NAME[h.tier] + '</div>' +
      '<div class="cname">' + h.name + '</div>' +
      '<div class="cdesc">' + (h.cd || '—') + '</div>' +
      stack + offTag +
    '</div>';
  }).join('');

  [...gridEl.children].forEach(el => {
    el.onclick = () => {
      const id = el.dataset.id;
      const h = HEX.find(x => x.id === id);
      if (!h.impl) return;
      const i = selected.indexOf(id);
      if (i >= 0) selected.splice(i, 1);
      else { selected.push(id); if (selected.length > MAX) selected.shift(); }
      render();
    };
  });

  const frac = totalH <= 670 ? 1 : 670 / totalH;
  const th = Math.max(40, 670 * frac);
  thumbEl.style.height = th + 'px';
  thumbEl.style.top = (maxScroll > 0 ? (scrollTop / maxScroll) * (670 - th) : 0) + 'px';

  renderSel();
}

function renderSel() {
  cntSel.textContent = selected.length;
  if (!selected.length) {
    selList.innerHTML = '<div class="side-empty">还没有选任何词条</div>';
    return;
  }
  selList.innerHTML = selected.map(id => {
    const h = HEX.find(x => x.id === id);
    if (!h) return '';
    const stk = h.stack > 1 ? '<span class="stk">叠 1/' + h.stack + '</span>' : '';
    return '<div class="srow t' + h.tier + '">' + h.name + stk + '<span class="x" data-id="' + id + '">✕</span></div>';
  }).join('');
  [...selList.querySelectorAll('.x')].forEach(x => {
    x.onclick = () => { selected = selected.filter(s => s !== x.dataset.id); render(); };
  });
}

document.getElementById('filters').onclick = e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  if (c.dataset.tier !== undefined) {
    state.tier = +c.dataset.tier;
    [...document.querySelectorAll('[data-tier]')].forEach(x => x.classList.toggle('on', x === c));
  } else if (c.dataset.form !== undefined) {
    state.form = c.dataset.form === '-1' ? -1 : c.dataset.form;
    [...document.querySelectorAll('[data-form]')].forEach(x => x.classList.toggle('on', x === c));
  }
  scrollTop = 0; render();
};

document.getElementById('q').oninput = e => { state.q = e.target.value; scrollTop = 0; render(); };

document.querySelector('.grid-wrap').addEventListener('wheel', e => {
  e.preventDefault();
  const rows = Math.ceil(filtered().length / 3);
  const maxScroll = Math.max(0, rows * 114 - 670);
  scrollTop = Math.max(0, Math.min(maxScroll, scrollTop + e.deltaY));
  render();
}, { passive: false });

function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit(); render();
</script>
